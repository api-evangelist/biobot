aid: biobot
name: Biobot
description: 'Biobot Analytics is a wastewater epidemiology company that operates a
  wastewater intelligence platform, analyzing sewage samples to detect and track more
  than 50 human health indicators — including pathogens (SARS-CoV-2, influenza, RSV,
  measles, norovirus), substances (fentanyl, cocaine, methamphetamine, buprenorphine),
  and public-health threats (HIV, mpox, poliovirus, Candida auris) — before they surface
  in conventional reporting. Founded from MIT research and headquartered in Cambridge,
  Massachusetts, Biobot serves federal, state, and local government agencies, pharmaceutical
  and life-sciences companies, and healthcare systems through dashboards, CSV exports,
  map visualizations, and enterprise data integrations. Biobot does not publish a public
  self-serve developer API; data access is arranged directly with the company.'
